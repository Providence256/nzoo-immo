<div>
  <p-toast></p-toast>
    <p-toolbar styleClass="mb-4" >
        <ng-template pTemplate="left">
            <div>
              <button  
                pButton 
                pRipple 
                label="Ajouter" 
                icon="pi pi-plus-circle" 
                class="p-button-primary mr-2"
                (click)="openDialog()"
              >
            </button>
              
            </div>
          </ng-template>
    </p-toolbar>

    <p-table
     [value]="bathroomTypes"
     [loading]="loading"
     paginator="true"
     [rows]="10"
     [rowsPerPageOptions]="[10, 20, 30]"
     responsiveLayout="stack"
     [showCurrentPageReport]="true"
     class="font-Jost"
     styleClass="p-datatable-customers p-datatable-striped p-datatable-gridlines p-datatable-sm"
    >
    <ng-template pTemplate="caption">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 p-3">
        <h2 class="text-lg font-semibold text-gray-800">Gestion des Types de Salle de Bain</h2>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            type="text"
            placeholder="Rechercher un type..."
            class="p-inputtext-sm font-Jost"
          />
        </p-iconfield>
      </div>
    </ng-template>
        <ng-template pTemplate="header">
          <tr>
            <th class="text-center font-Jost">Nom</th>
            <th class="text-center font-Jost">Description</th>
            <th class="text-center font-Jost">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-type >
          <tr>
            <td class="text-center font-Jost">{{ type.name }}</td>
            <td class="text-center font-Jost">{{ type.description }}</td>
          
            <td class="text-center">
              <div class="flex justify-center gap-2 h-full">
                <button
                  pButton
                  icon="pi pi-pencil"
                  class="p-button-sm p-button-rounded p-button-info"
                  pTooltip="Modifier"
                  tooltipPosition="top"
                  (click)="editBathroomType(type)"
                ></button>
                <button
                  pButton
                  icon="pi pi-trash"
                  class="p-button-sm p-button-rounded p-button-danger"
                  pTooltip="Supprimer"
                  tooltipPosition="top"
                  (click)="deleteBathroomType(type)"
                ></button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center p-4">
              <div class="flex flex-col items-center justify-center py-6">
                <i class="pi pi-info-circle text-4xl text-blue-300 mb-2"></i>
                <span class="text-lg">Aucun type de salle de bain trouvé</span>
              </div>
            </td>
          </tr>
        </ng-template>
    </p-table>
</div>


<p-dialog 
[header]="bathroomType.id ? 'Modifier Type de Salle de Bain' : 'Ajouter Type de Salle de Bain'" 
class="font-Jost"
[modal]="true" 
[(visible)]="dialog"
[breakpoints]="{'960px': '75vw', '640px': '90vw'}"
[style]="{width: '550px'}"
[contentStyle]="{'border-radius': '8px', 'overflow-y': 'auto', 'max-height': '85vh'}"
[closeOnEscape]="true"
>
<div class="p-3 sm:p-5">
 <form [formGroup]="formGroup" >
   
  <!-- Name Field -->
  <div class="mb-5">
    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
      Nom <span class="text-red-500">*</span>
    </label>
    <span class="p-input-icon-left w-full">
      <input 
        pInputText 
        id="name"
        placeholder="Nom du type"
        required
        formControlName="name"
        class="w-full p-inputtext-sm"
        [ngClass]="{'ng-dirty': isInvalid('name')}"
        autocomplete="off" 
      />
    </span>
    <small *ngIf="isInvalid('name')" class="p-error block mt-1">
      {{ getErrorMessage('name') }}
    </small>
  </div>

  <!-- Description Field -->
  <div class="mb-5">
    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
      Description <span class="text-red-500">*</span>
    </label>
    <textarea 
      pInputText 
      id="description"
      placeholder="Description du type de salle de bain"
      required
      formControlName="description"
      rows="4"
      class="w-full border rounded-md text-gray-700 p-inputtext-sm"
      [ngClass]="{'ng-dirty': isInvalid('description')}"
      autocomplete="off"
    ></textarea>
    <small *ngIf="isInvalid('description')" class="p-error block mt-1">
      {{ getErrorMessage('description') }}
    </small>
  </div>
 </form>
</div>

  <!-- Buttons -->
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2 pt-3">
      <button 
        pButton
        type="button"
        label="Annuler" 
        icon="pi pi-times"
        class="font-Jost p-button-secondary"
        severity="secondary"
        [disabled]="loading"
        (click)="annuler()"
      ></button>
      <button 
        pButton
        type="button"
        [label]="bathroomType.id ? 'Modifier' : 'Enregistrer'" 
        icon="pi pi-check"
        class="font-Jost p-button-primary"
        [loading]="loading"
        (click)="addBathroomType()"
      ></button>
    </div>
  </ng-template>
</p-dialog>


  <!-- Delete Confirmation Dialog -->
  <p-dialog [(visible)]="deleteDialog" 
  header="Confirmer la Suppression" 
  [modal]="true" 
  [style]="{ width: 'min(500px, 90vw)' }">
  <div class="flex items-center p-4">
  <i class="pi pi-exclamation-triangle mr-3 text-yellow-500" style="font-size: 2rem"></i>
  <span *ngIf="bathroomType" class="text-lg">
  Voulez-vous vraiment supprimer <b>{{ bathroomType.name }}</b>?
  <p class="text-sm text-gray-500 mt-2">Cette action est irréversible.</p>
  </span>
  </div>
  
  <ng-template pTemplate="footer">
  <div class="flex justify-end gap-2">
  <button pButton pRipple label="Non" 
      class="p-button-text" icon="pi pi-times"
      (click)="cancelDelete()"></button>
  <button pButton pRipple label="Oui" 
      class="p-button-danger" icon="pi pi-check"
      [loading]="loading"
      (click)="confirmDelete(bathroomType.id)"></button>
  </div>
  </ng-template>
  </p-dialog>
