<div class="date-picker-container">
  <div class="date-range-wrapper" [class.in-dialog]="isInDialog">
    <!-- Date Range Selector UI -->
    <div class="inputs-container">
      <!-- Check-in Input -->
      <div class="input" [class.active]="activeSelector === 'check-in'">
        <div class="label">ARRIVÉE</div>
        <div class="value">
          {{ selectedStartDate ? formatDisplayDate(selectedStartDate) : 'Ajouter date' }}
        </div>
      </div>

      <!-- Separator -->
      <div class="separator"></div>

      <!-- Check-out Input -->
      <div class="input" [class.active]="activeSelector === 'check-out'">
        <div class="label">DÉPART</div>
        <div class="value">
          {{ selectedEndDate ? formatDisplayDate(selectedEndDate) : 'Ajouter date' }}
        </div>
      </div>

      <!-- Clear Button -->
      <button *ngIf="selectedStartDate || selectedEndDate"
              class="clear-btn"
              (click)="clearSelection(); $event.stopPropagation()"
              aria-label="Effacer les dates">
        <span>×</span>
      </button>
    </div>

    <!-- Dropdown Calendar -->
    <div class="dropdown">
      <!-- Calendar Header -->
      <div class="dropdown-header">
        <button class="nav-btn" 
                (click)="previousMonth()"
                aria-label="Mois précédent">
          <span>←</span>
        </button>
        
        <div class="month-labels">
          <span *ngFor="let month of displayedMonths">
            {{ formatMonth(month) | uppercase }}
          </span>
        </div>
        
        <button class="nav-btn" 
                (click)="nextMonth()"
                aria-label="Mois suivant">
          <span>→</span>
        </button>
      </div>

      <!-- Calendars Container -->
      <div class="calendars-container">
        <div class="calendar" *ngFor="let month of displayedMonths">
          <!-- Week Days Header -->
          <div class="week-days">
            <div class="day-name" *ngFor="let day of weekDays">{{ day }}</div>
          </div>
          
          <!-- Month Days -->
          <div class="month-days">
            <ng-container *ngFor="let day of daysInMonth(month)">
              <!-- Empty cells -->
              <div *ngIf="!day" class="day-cell empty"></div>
              
              <!-- Date buttons -->
              <button *ngIf="day"
                      class="day-button"
                      [class.today]="isToday(day)"
                      [class.start-date]="isStartDate(day)"
                      [class.end-date]="isEndDate(day)"
                      [class.in-range]="isInRange(day)"
                      [class.selected]="isSelected(day)"
                      [disabled]="isDisabled(day)"
                      (click)="onDateClick(day)"
                      [attr.aria-label]="formatDay(day) + ' ' + formatMonth(month)">
                {{ formatDay(day) }}
              </button>
            </ng-container>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="dropdown-footer">
        <div class="nights-info" *ngIf="selectedStartDate">
          {{ getDatesCount() }} Nuit<span *ngIf="getDatesCount() > 1">s</span> 
        </div>
        
        <div class="action-buttons">
          <button class="btn-cancel" (click)="cancel()">
            Annuler
          </button>
          <button class="btn-save" 
                  [disabled]="!selectedStartDate || !selectedEndDate"
                  (click)="save()">
            Enregistrer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
