<!-- modify-guest.component.html -->
<div class="w-full bg-white">
  <!-- Main Content -->
  <div class="p-4 sm:p-6">
    <form [formGroup]="guestForm" class="space-y-1">
      <!-- Adults Row -->
      <div class="flex items-center justify-between py-4 sm:py-5 border-b border-gray-100 hover:bg-gray-50 hover:-mx-4 hover:px-4 sm:hover:-mx-6 sm:hover:px-6 rounded-lg transition-all duration-200">
        <div class="flex-1 pr-4">
          <div class="text-base font-Jost sm:text-lg font-semibold text-gray-900 mb-1">
            Adultes
          </div>
          <div class="text-sm font-Jost text-gray-500">
            13 ans et plus
          </div>
        </div>
        <div class="flex items-center space-x-3 sm:space-x-4">
          <button
            type="button"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-gray-300 bg-white flex items-center justify-center text-gray-600 hover:border-gray-800 hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:border-gray-300 transition-all duration-200"
            (click)="decreaseCount('adults')"
            [disabled]="isDecrementDisabled('adults')"
          >
            <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
            </svg>
          </button>
          <span class="min-w-[2rem] text-center font-Jost text-base sm:text-lg font-semibold text-gray-900">
            {{guestForm.get('adults')?.value}}
          </span>
          <button
            type="button"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-gray-300 bg-white flex items-center justify-center text-gray-600 hover:border-gray-800 hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:border-gray-300 transition-all duration-200"
            (click)="increaseCount('adults')"
            [disabled]="isIncrementDisabled('adults')"
          >
            <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Children Row -->
      <div class="flex items-center justify-between py-4 sm:py-5 border-b border-gray-100 hover:bg-gray-50 hover:-mx-4 hover:px-4 sm:hover:-mx-6 sm:hover:px-6 rounded-lg transition-all duration-200">
        <div class="flex-1 pr-4">
          <div class="text-base sm:text-lg font-Jost font-semibold text-gray-900 mb-1">
            Enfants
          </div>
          <div class="text-sm font-Jost text-gray-500">
            2-12 ans
          </div>
        </div>
        <div class="flex items-center space-x-3 sm:space-x-4">
          <button
            type="button"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-gray-300 bg-white flex items-center justify-center text-gray-600 hover:border-gray-800 hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:border-gray-300 transition-all duration-200"
            (click)="decreaseCount('children')"
            [disabled]="isDecrementDisabled('children')"
          >
            <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
            </svg>
          </button>
          <span class="min-w-[2rem] text-center text-base sm:text-lg font-semibold text-gray-900">
            {{guestForm.get('children')?.value}}
          </span>
          <button
            type="button"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-gray-300 bg-white flex items-center justify-center text-gray-600 hover:border-gray-800 hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:border-gray-300 transition-all duration-200"
            (click)="increaseCount('children')"
            [disabled]="isIncrementDisabled('children')"
          >
            <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Babies Row -->
      <div class="flex items-center justify-between py-4 sm:py-5 hover:bg-gray-50 hover:-mx-4 hover:px-4 sm:hover:-mx-6 sm:hover:px-6 rounded-lg transition-all duration-200">
        <div class="flex-1 pr-4">
          <div class="text-base sm:text-lg font-Jost font-semibold text-gray-900 mb-1">
            Bébés
          </div>
          <div class="text-sm font-Jost text-gray-500">
            Moins de 2 ans
          </div>
        </div>
        <div class="flex items-center space-x-3 sm:space-x-4">
          <button
            type="button"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-gray-300 bg-white flex items-center justify-center text-gray-600 hover:border-gray-800 hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:border-gray-300 transition-all duration-200"
            (click)="decreaseCount('babies')"
            [disabled]="isDecrementDisabled('babies')"
          >
            <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
            </svg>
          </button>
          <span class="min-w-[2rem] text-center text-base sm:text-lg font-semibold text-gray-900">
            {{guestForm.get('babies')?.value}}
          </span>
          <button
            type="button"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-gray-300 bg-white flex items-center justify-center text-gray-600 hover:border-gray-800 hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:border-gray-300 transition-all duration-200"
            (click)="increaseCount('babies')"
            [disabled]="isIncrementDisabled('babies')"
          >
            <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
          </button>
        </div>
      </div>
    </form>

    <!-- Info Text -->
    <div class="mt-6 p-4 bg-blue-50 border-l-4 border-blue-400 rounded-r-lg">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-blue-700">
            La capacité d'accueil de ce logement est limitée à <span class="font-semibold">{{maxOccupancy}}</span> voyageurs, sans compter les bébés.
          </p>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="flex flex-col sm:flex-row justify-between items-center pt-6 mt-6 border-t border-gray-200 space-y-3 sm:space-y-0">
      <div class="text-sm text-gray-500 order-2 sm:order-1">
        <!-- You can add nights info here if needed -->
      </div>
      <div class="flex space-x-3 order-1 sm:order-2 w-full sm:w-auto">
        <button
          type="button"
          class="flex-1 sm:flex-none px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-full hover:bg-gray-50 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all duration-200"
          (click)="onCancel()"
        >
          Annuler
        </button>
        <button
          type="button"
          class="flex-1 sm:flex-none px-6 py-2.5 text-sm font-medium text-white bg-gradient-to-r from-blue-500 to-blue-600 rounded-full hover:from-blue-600 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform hover:scale-105 active:scale-95 transition-all duration-200 shadow-lg hover:shadow-xl"
          (click)="onSave()"
        >
          Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>
