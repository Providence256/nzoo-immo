<header class="bg-white border-b border-gray-200 fixed w-full top-0 left-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <!-- Left Section: Logo & Navigation -->
      <div class="flex items-center space-x-8">
        <!-- Logo -->
        <div class="flex items-center">
          <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-teal-400 to-teal-500 flex items-center justify-center text-white shadow-md">
            <i class="pi pi-th-large text-sm"></i>
          </div>
          <h2 class="ml-3 text-lg font-semibold font-Jost text-gray-900">
            <span class="text-teal-500">nzoo</span><span class="text-amber-500">.immo</span>
          </h2>
        </div>

        <!-- Desktop Navigation -->
        <nav class="hidden lg:flex items-center space-x-1">
          <!-- Dashboard -->
          <a routerLink="/admin/dashboard" 
             routerLinkActive="bg-gray-100 text-gray-900"
             class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-100 transition-colors">
            <i class="pi pi-home mr-2"></i>
            Tableau de Bord
          </a>

          <!-- Éléments de base - Dropdown -->
          <div class="relative">
            <button 
              (click)="toggleDropdown('elements')"
              class="flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-100 transition-colors"
              [class.bg-gray-100]="activeDropdown === 'elements'"
              [class.text-gray-900]="activeDropdown === 'elements'">
              <i class="pi pi-box mr-2"></i>
              Éléments de base
              <i class="pi pi-chevron-down ml-1 text-xs transition-transform" 
                 [class.rotate-180]="activeDropdown === 'elements'"></i>
            </button>
            
            <div *ngIf="activeDropdown === 'elements'" 
                 class="absolute left-0 mt-2 w-56 bg-white shadow-lg rounded-lg border border-gray-200 py-2 z-50">
              <a routerLink="/admin/files/villes" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-map-marker mr-3 text-teal-500"></i>
                Villes
              </a>
              <a routerLink="/admin/files/communes" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-address-book mr-3 text-teal-500"></i>
                Communes
              </a>
              <a routerLink="/admin/files/type-hebergement" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-building-columns mr-3 text-teal-500"></i>
                Type hébergement
              </a>
              <a routerLink="/admin/files/equipements" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-folder mr-3 text-teal-500"></i>
                Équipements
              </a>
              <a routerLink="/admin/files/devises" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-wallet mr-3 text-teal-500"></i>
                Devises
              </a>
              <a routerLink="/admin/files/regles" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-key mr-3 text-teal-500"></i>
                Règles
              </a>
            </div>
          </div>

          <!-- Saisie - Dropdown -->
          <div class="relative">
            <button 
              (click)="toggleDropdown('saisie')"
              class="flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-100 transition-colors"
              [class.bg-gray-100]="activeDropdown === 'saisie'"
              [class.text-gray-900]="activeDropdown === 'saisie'">
              <i class="pi pi-print mr-2"></i>
              Saisie
              <i class="pi pi-chevron-down ml-1 text-xs transition-transform" 
                 [class.rotate-180]="activeDropdown === 'saisie'"></i>
            </button>
            
            <div *ngIf="activeDropdown === 'saisie'" 
                 class="absolute left-0 mt-2 w-48 bg-white shadow-lg rounded-lg border border-gray-200 py-2 z-50">
              <a routerLink="/admin/saisies/taux-change" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-dollar mr-3 text-teal-500"></i>
                Cours de change
              </a>
              <a routerLink="/admin/saisies/list-annonce" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-building mr-3 text-teal-500"></i>
                Annonces
              </a>
            </div>
          </div>

          <!-- Paramètres - Dropdown -->
          <div class="relative">
            <button 
              (click)="toggleDropdown('parametres')"
              class="flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-100 transition-colors"
              [class.bg-gray-100]="activeDropdown === 'parametres'"
              [class.text-gray-900]="activeDropdown === 'parametres'">
              <i class="pi pi-cog mr-2"></i>
              Paramètres
              <i class="pi pi-chevron-down ml-1 text-xs transition-transform" 
                 [class.rotate-180]="activeDropdown === 'parametres'"></i>
            </button>
            
            <div *ngIf="activeDropdown === 'parametres'" 
                 class="absolute left-0 mt-2 w-48 bg-white shadow-lg rounded-lg border border-gray-200 py-2 z-50">
              <a routerLink="/admin/parametres/societe" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-wrench mr-3 text-teal-500"></i>
                Paramètre société
              </a>
              <a routerLink="/admin/parametres/utilisateurs" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-2 border-teal-500"
                 class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                <i class="pi pi-user mr-3 text-teal-500"></i>
                Utilisateurs
              </a>
            </div>
          </div>
        </nav>
      </div>

      <!-- Right Section: Actions & User Menu -->
      <div class="flex items-center space-x-4">
        <!-- Mobile Menu Button -->
        <button 
          *ngIf="isMobileView" 
          (click)="toggleMobileMenu()"
          class="lg:hidden p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none">
          <i class="pi pi-bars text-lg"></i>
        </button>

        <!-- Search Button (Desktop) -->
        <button class="hidden md:flex p-2 rounded-full text-gray-400 hover:text-gray-500 hover:bg-gray-100 transition-colors">
          <i class="pi pi-search"></i>
        </button>

        <!-- Notifications -->
        <button class="relative p-2 rounded-full text-gray-400 hover:text-gray-500 hover:bg-gray-100 transition-colors">
          <i class="pi pi-bell"></i>
          <span class="absolute -top-1 -right-1 bg-teal-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center shadow-md">3</span>
        </button>

        <!-- User Dropdown -->
        <div class="relative">
          <button 
            (click)="toggleUserDropdown()" 
            class="flex items-center p-1 rounded-full bg-gray-200 hover:bg-gray-300 transition-colors focus:outline-none">
            <div class="h-8 w-8 rounded-full bg-gradient-to-br from-teal-500 to-emerald-500 flex items-center justify-center text-white">
              <i class="pi pi-user text-sm"></i>
            </div>
          </button>
          
          <div *ngIf="userDropdownOpen" 
               class="absolute right-0 mt-2 w-64 bg-white shadow-lg rounded-xl border border-gray-200 overflow-hidden z-50">
            <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
              <p class="font-medium text-gray-900">Admin User</p>
              <p class="text-sm text-gray-500">adminnzoo.immo</p>
            </div>
            <div class="py-2">
              <a href="/profile" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <i class="pi pi-user mr-3 text-teal-500"></i>Profil
              </a>
              <a routerLink="/home" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <i class="pi pi-home mr-3 text-teal-500"></i>Site client
              </a>
              <hr class="my-2">
              <a href="#" (click)="logout()" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <i class="pi pi-sign-out mr-3 text-red-500"></i>Déconnexion
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Navigation Menu -->
    <div *ngIf="mobileMenuOpen" class="lg:hidden border-t border-gray-200 py-4">
      <div class="space-y-2">
        <!-- Dashboard Mobile -->
        <a routerLink="/admin/dashboard" 
           routerLinkActive="bg-teal-50 text-teal-700 border-l-4 border-teal-500"
           (click)="closeMobileMenu()"
           class="flex items-center px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
          <i class="pi pi-home mr-3"></i>
          Tableau de Bord
        </a>

        <!-- Mobile Dropdowns -->
        <div class="space-y-1">
          <button 
            (click)="toggleMobileSection('elements')"
            class="w-full flex items-center justify-between px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
            <div class="flex items-center">
              <i class="pi pi-box mr-3"></i>
              Éléments de base
            </div>
            <i class="pi pi-chevron-down text-xs transition-transform" 
               [class.rotate-180]="activeMobileSection === 'elements'"></i>
          </button>
          <div *ngIf="activeMobileSection === 'elements'" class="ml-4 space-y-1">
            <a routerLink="/admin/files/villes" 
               routerLinkActive="bg-teal-50 text-teal-700"
               (click)="closeMobileMenu()"
               class="flex items-center px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">
              <i class="pi pi-map-marker mr-3 text-teal-500"></i>Villes
            </a>
            <a routerLink="/admin/files/communes" 
               routerLinkActive="bg-teal-50 text-teal-700"
               (click)="closeMobileMenu()"
               class="flex items-center px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">
              <i class="pi pi-address-book mr-3 text-teal-500"></i>Communes
            </a>
            <!-- Ajoutez les autres liens ici -->
          </div>
        </div>

        <!-- Répétez pour les autres sections -->
      </div>
    </div>
  </div>
</header>
