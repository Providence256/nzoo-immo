<header class="bg-white border-b border-gray-200 fixed w-full top-0 left-0 z-50 shadow-sm">
  <div class="mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      
      <!-- Left Section: Logo -->
      <div class="flex items-center flex-shrink-0">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-blue-400 to-blue-500 flex items-center justify-center text-white shadow-lg">
          <i class="pi pi-th-large text-lg"></i>
        </div>
        <h2 class="ml-3 text-xl font-bold font-Jost text-gray-900 hidden sm:block">
          <span class="text-blue-500">nzoo</span><span class="text-amber-500">.immo</span>
        </h2>
        <!-- Role Badge -->
        <span class="ml-3 px-3 py-1 text-xs font-medium rounded-full bg-gradient-to-r"
              [ngClass]="{
                'from-purple-100 to-purple-200 text-purple-800': isRoot(),
                'from-blue-100 to-blue-200 text-blue-800': isAdmin() && !isRoot(),
                'from-green-100 to-green-200 text-green-800': isHost(),
                'from-gray-100 to-gray-200 text-gray-800': isClient()
              }">
          {{ getRoleDisplayName() }}
        </span>
      </div>

      <!-- Center Section: Dynamic Navigation Menu -->
      <nav class="hidden lg:flex items-center justify-center flex-1 max-w-4xl mx-8">
        <div class="flex items-center bg-white rounded-full transition-all duration-300 px-2">
          
          <!-- Dashboard -->
          <a [routerLink]="getDashboardRoute()" 
             routerLinkActive="bg-gray-100 text-gray-900"
             class="px-6 py-3 rounded-full text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200">
            <i class="pi pi-home mr-2"></i>
            Dashboard
          </a>

          <div class="w-px h-8 bg-gray-300"></div>

          <!-- Dynamic Menu Items based on Role -->
          <ng-container *ngFor="let menuItem of getMenuItems(); let last = last">
            
            <!-- Menu with Dropdown -->
            <div *ngIf="menuItem.items && menuItem.items.length > 0" class="relative">
              <button 
                (click)="toggleDropdown(menuItem.key)"
                class="flex items-center px-6 py-3 rounded-full text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200"
                [class.bg-gray-100]="activeDropdown === menuItem.key"
                [class.text-gray-900]="activeDropdown === menuItem.key">
                <i class="pi {{ menuItem.icon }} mr-2"></i>
                {{ menuItem.label }}
                <i class="pi pi-chevron-down ml-1 text-xs transition-transform duration-200"
                   [class.rotate-180]="activeDropdown === menuItem.key"></i>
              </button>
              
              <div *ngIf="activeDropdown === menuItem.key" 
                   class="absolute left-1/2 transform -translate-x-1/2 mt-3 w-64 bg-white shadow-xl rounded-2xl border border-gray-100 py-3 z-50 animate-in fade-in slide-in-from-top-2 duration-200">
                <a *ngFor="let subItem of menuItem.items"
                   [routerLink]="subItem.path" 
                   routerLinkActive="bg-teal-50 text-teal-700"
                   class="flex items-center px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 rounded-xl mx-2 transition-all duration-150">
                  <i class="pi {{ subItem.icon }} mr-3 text-gray-500"></i>
                  {{ subItem.label }}
                </a>
              </div>
            </div>

            <!-- Simple Menu Item (no dropdown) -->
            <div *ngIf="!menuItem.items && menuItem.path">
              <a [routerLink]="menuItem.path" 
                 routerLinkActive="bg-gray-100 text-gray-900"
                 class="flex items-center px-6 py-3 rounded-full text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200">
                <i class="pi {{ menuItem.icon }} mr-2"></i>
                {{ menuItem.label }}
              </a>
            </div>

            <!-- Separator (not for last item) -->
            <div *ngIf="!last" class="w-px h-8 bg-gray-300"></div>
          </ng-container>

        </div>
      </nav>

      <!-- Right Section: Actions & User Menu -->
      <div class="flex items-center space-x-3">
        <!-- Mobile Menu Button -->
        <button 
          *ngIf="isMobileView" 
          (click)="toggleMobileMenu()"
          class="lg:hidden p-3 rounded-full text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-all duration-200">
          <i class="pi pi-bars text-lg"></i>
        </button>

        <!-- Search Button (Desktop) -->
        <button class="hidden md:flex p-3 rounded-full text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-all duration-200">
          <i class="pi pi-search text-lg"></i>
        </button>

        <!-- Notifications -->
        <button class="relative p-3 rounded-full text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-all duration-200">
          <i class="pi pi-bell text-lg"></i>
          <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center shadow-md animate-pulse">3</span>
        </button>

        <!-- User Dropdown -->
        <div class="relative">
          <button 
            (click)="toggleUserDropdown()" 
            class="flex items-center p-1.5 rounded-full bg-gray-100 hover:bg-gray-200 transition-all duration-200 focus:outline-none border border-gray-300 hover:shadow-md">
            <div class="h-9 w-9 rounded-full flex items-center justify-center text-white"
                 [ngClass]="{
                   'bg-gradient-to-br from-purple-500 to-purple-600': isRoot(),
                   'bg-gradient-to-br from-blue-500 to-blue-600': isAdmin() && !isRoot(),
                   'bg-gradient-to-br from-green-500 to-green-600': isHost(),
                   'bg-gradient-to-br from-gray-500 to-gray-600': isClient()
                 }">
              <i class="pi pi-user text-sm"></i>
            </div>
          </button>
          
          <div *ngIf="userDropdownOpen" 
               class="absolute right-0 mt-3 w-80 bg-white shadow-xl rounded-2xl border border-gray-100 overflow-hidden z-50 animate-in fade-in slide-in-from-top-2 duration-200">
            <div class="px-6 py-4 border-b border-gray-100"
                 [ngClass]="{
                   'bg-gradient-to-r from-purple-50 to-purple-100': isRoot(),
                   'bg-gradient-to-r from-blue-50 to-blue-100': isAdmin() && !isRoot(),
                   'bg-gradient-to-r from-green-50 to-green-100': isHost(),
                   'bg-gradient-to-r from-gray-50 to-gray-100': isClient()
                 }">
              <p class="font-semibold text-gray-900">{{ getDisplayName() }}</p>
              <p class="text-sm text-gray-600">{{ getDisplayEmail() }}</p>
              <p class="text-xs text-gray-500 mt-1">{{ getRoleDisplayName() }}</p>
            </div>
            
            <div class="py-2">
              <!-- Profile -->
              <a href="/profile" class="flex items-center px-6 py-3 text-sm text-gray-700 hover:bg-gray-50 transition-all duration-150">
                <i class="pi pi-user mr-3 text-gray-500"></i>Profil
              </a>
              
              <!-- Site Client -->
              <a routerLink="/home" class="flex items-center px-6 py-3 text-sm text-gray-700 hover:bg-gray-50 transition-all duration-150">
                <i class="pi pi-home mr-3 text-gray-500"></i>Site client
              </a>

              <!-- Role Switch Section (if applicable) -->
              <ng-container *ngIf="isAdmin() || isHost()">
                <hr class="my-2 mx-6">
                <div class="px-6 py-2">
                  <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Changer de mode</p>
                </div>
                
                <!-- Switch to Admin Mode -->
                <button *ngIf="isHost() && (isAdmin() || isRoot())" 
                        (click)="switchToAdminMode()" 
                        class="w-full flex items-center px-6 py-3 text-sm text-gray-700 hover:bg-blue-50 transition-all duration-150">
                  <i class="pi pi-cog mr-3 text-blue-500"></i>Mode Administrateur
                </button>
                
                <!-- Switch to Host Mode -->
                <button *ngIf="isAdmin() && isHost()" 
                        (click)="switchToHostMode()" 
                        class="w-full flex items-center px-6 py-3 text-sm text-gray-700 hover:bg-green-50 transition-all duration-150">
                  <i class="pi pi-home mr-3 text-green-500"></i>Mode Hôte
                </button>
              </ng-container>

              <hr class="my-2 mx-6">
              
              <!-- Logout -->
              <button (click)="logout()" 
                      class="w-full flex items-center px-6 py-3 text-sm text-gray-700 hover:bg-red-50 transition-all duration-150">
                <i class="pi pi-sign-out mr-3 text-red-500"></i>Déconnexion
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Navigation Menu -->
    <div *ngIf="mobileMenuOpen" class="lg:hidden absolute top-full left-0 right-0 bg-white border-t border-gray-200 shadow-xl backdrop-blur-sm">
      <div class="max-h-96 overflow-y-auto py-4">
        
        <!-- Dashboard Mobile -->
        <a [routerLink]="getDashboardRoute()" 
           routerLinkActive="bg-teal-50 text-teal-700 border-r-4 border-teal-500"
           (click)="closeMobileMenu()"
           class="flex items-center px-6 py-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200">
          <i class="pi pi-home mr-4 text-lg"></i>
          Dashboard
        </a>

        <!-- Mobile Sections -->
        <div class="space-y-1">
          <ng-container *ngFor="let menuItem of getMenuItems()">
            
            <!-- Menu with Dropdown -->
            <div *ngIf="menuItem.items && menuItem.items.length > 0" class="border-t border-gray-100 pt-2">
              <button 
                (click)="toggleMobileSection(menuItem.key)"
                class="w-full flex items-center justify-between px-6 py-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200">
                <div class="flex items-center">
                  <i class="pi {{ menuItem.icon }} mr-4 text-lg"></i>
                  {{ menuItem.label }}
                </div>
                <i class="pi pi-chevron-down text-xs transition-transform duration-200" 
                   [class.rotate-180]="activeMobileSection === menuItem.key"></i>
              </button>
              
              <div *ngIf="activeMobileSection === menuItem.key" class="bg-gray-50 space-y-1">
                <a *ngFor="let subItem of menuItem.items"
                   [routerLink]="subItem.path" 
                   routerLinkActive="bg-teal-100 text-teal-700"
                   (click)="closeMobileMenu()"
                   class="flex items-center px-12 py-3 text-sm text-gray-600 hover:bg-gray-100 transition-all duration-150">
                  <i class="pi {{ subItem.icon }} mr-3 text-gray-500"></i>{{ subItem.label }}
                </a>
              </div>
            </div>

            <!-- Simple Menu Item (no dropdown) -->
            <div *ngIf="!menuItem.items && menuItem.path" class="border-t border-gray-100 pt-2">
              <a [routerLink]="menuItem.path" 
                 routerLinkActive="bg-teal-50 text-teal-700 border-r-4 border-teal-500"
                 (click)="closeMobileMenu()"
                 class="flex items-center px-6 py-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200">
                <i class="pi {{ menuItem.icon }} mr-4 text-lg"></i>
                {{ menuItem.label }}
              </a>
            </div>
            
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</header>
